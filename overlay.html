<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>車掃直播圖層</title>
<style>
  :root {
    --ring: #2453E6;
    --card-from: rgba(36, 83, 230, .94);
    --card-to: rgba(22, 48, 150, .94);
    --font: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Heiti TC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: var(--font);
  }

  /* 地圖：正圓加底部細條。底部細條用來完整保留 Google 標誌與版權標示 */
  #mapShell {
    position: absolute;
    width: 396px;
    height: 436px;
    opacity: 0;
    transition: opacity .6s ease;
  }
  #mapShell.on { opacity: 1; }
  .ring-circle, .ring-base {
    position: absolute;
    left: 0;
    background: var(--ring);
    box-shadow: 0 8px 22px rgba(0, 0, 0, .42);
  }
  .ring-circle { top: 20px; width: 396px; height: 396px; border-radius: 50%; }
  .ring-base { top: 388px; width: 396px; height: 48px; border-radius: 12px; }
  .map-clip {
    position: absolute;
    left: 8px;
    top: 8px;
    width: 380px;
    height: 420px;
    background: #e8eaed;
    clip-path: path("M190 20a190 190 0 1 1 0 380a190 190 0 1 1 0-380Z M4 388H376a4 4 0 0 1 4 4V416a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V392a4 4 0 0 1 4-4Z");
  }
  #map { width: 100%; height: 100%; }
  #avatar, #avatarDot {
    position: absolute;
    left: 166px;
    top: 186px;
    width: 64px;
    height: 64px;
    pointer-events: none;
  }
  #avatar { object-fit: contain; filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .45)); }
  #avatarDot {
    display: none;
    left: 182px;
    top: 202px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--ring);
    border: 5px solid #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .5);
  }

  /* 下一站字卡 */
  #nextStop {
    position: absolute;
    min-width: 420px;
    max-width: 760px;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .35s ease, transform .35s ease;
  }
  #nextStop.on { opacity: 1; transform: none; }
  .next-tag {
    display: inline-block;
    padding: 7px 16px;
    background: #111;
    color: #fff;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .02em;
  }
  .next-main {
    padding: 15px 34px;
    background: linear-gradient(100deg, var(--card-from), var(--card-to));
    color: #fff;
    font-size: 42px;
    font-weight: 800;
    line-height: 1.25;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .35);
  }
  #nextText { display: inline-block; transition: opacity .2s ease, transform .2s ease; }
  #nextText.swap { opacity: 0; transform: translateY(-8px); }

  /* 路線跑馬燈 */
  #marquee {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 12px;
    height: 60px;
    padding: 0 26px 0 12px;
    border-radius: 30px;
    background: #fff;
    color: #111;
    box-shadow: 0 5px 16px rgba(0, 0, 0, .3);
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity .35s ease, transform .35s ease;
  }
  #marquee.on { opacity: 1; transform: none; }
  .mq-icon {
    flex: none;
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--ring);
  }
  .mq-view { overflow: hidden; white-space: nowrap; min-width: 0; }
  .mq-track { display: inline-flex; font-size: 30px; font-weight: 700; will-change: transform; }
  .mq-track span + span { display: none; padding-left: 90px; }
  .mq-track.scroll { animation: mq var(--mq-time, 12s) linear infinite; }
  .mq-track.scroll span { padding-right: 0; }
  .mq-track.scroll span + span { display: inline; }
  @keyframes mq { to { transform: translateX(var(--mq-dist, -50%)); } }

  /* 只在 ?debug=1 時顯示，正式直播不會出現 */
  #debug {
    display: none;
    position: absolute;
    left: 20px;
    top: 20px;
    padding: 10px 14px;
    border-radius: 8px;
    background: rgba(0, 0, 0, .78);
    color: #7dffa8;
    font: 18px/1.5 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre;
  }
</style>
</head>
<body>
  <div id="marquee" aria-live="polite">
    <div class="mq-icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V11a4 4 0 0 1 4-4h10"/><path d="m15 3 4 4-4 4"/></svg>
    </div>
    <div class="mq-view"><div class="mq-track" id="mqTrack"><span id="mqA"></span><span id="mqB" aria-hidden="true"></span></div></div>
  </div>

  <section id="nextStop" aria-live="polite">
    <div class="next-tag">NEXT STOP 下一站 ▸▸</div>
    <div class="next-main"><span id="nextText"></span></div>
  </section>

  <div id="mapShell">
    <div class="ring-circle"></div>
    <div class="ring-base"></div>
    <div class="map-clip"><div id="map"></div></div>
    <img id="avatar" alt="">
    <div id="avatarDot"></div>
  </div>

  <div id="debug"></div>

  <script src="./config.js"></script>
  <script>
  (() => {
    'use strict';

    const C = window.OVERLAY_CONFIG || {};
    const hash = new URLSearchParams(location.hash.slice(1));
    const query = new URLSearchParams(location.search);
    const DEMO = query.has('demo');
    const forceCards = query.has('cards');

    const pullKey = hash.get('pull') || C.rtirlPullKey || '';
    const room = hash.get('room') || '';
    const delayRaw = Number(hash.get('delay') ?? C.gpsDelayMs ?? 0);
    const delayMs = Number.isFinite(delayRaw) ? Math.min(Math.max(delayRaw, 0), 30000) : 0;

    const features = {
      map: C.features?.map !== false,
      nextStop: forceCards || !!C.features?.nextStop,
      marquee: forceCards || !!C.features?.marquee,
    };

    const $ = (id) => document.getElementById(id);
    const status = { gps: '等待中', map: '未啟動', firebase: features.nextStop || features.marquee ? '未連線' : '未使用' };
    let lastFixAt = 0;

    const loadScript = (src) => new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = resolve;
      s.onerror = () => { s.remove(); reject(new Error('載入失敗：' + src.split('?')[0])); };
      document.head.appendChild(s);
    });
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    async function loadWithRetry(src, label) {
      for (;;) {
        try { return await loadScript(src); }
        catch (e) { status[label] = '載入失敗，5 秒後重試'; await wait(5000); }
      }
    }

    function applyTheme() {
      const t = C.theme || {};
      const root = document.documentElement.style;
      if (t.ring) root.setProperty('--ring', t.ring);
      if (t.cardFrom) root.setProperty('--card-from', t.cardFrom);
      if (t.cardTo) root.setProperty('--card-to', t.cardTo);

      const m = C.map || {};
      const k = C.cards || {};
      const right = m.right ?? 50;
      const bottom = m.bottom ?? 270;
      $('mapShell').style.right = right + 'px';
      $('mapShell').style.bottom = bottom + 'px';
      $('nextStop').style.left = (k.nextStopLeft ?? 240) + 'px';
      $('nextStop').style.bottom = bottom + 'px';
      $('marquee').style.left = (k.marqueeLeft ?? 860) + 'px';
      $('marquee').style.top = (k.marqueeTop ?? 44) + 'px';
      $('marquee').style.maxWidth = (k.marqueeMaxWidth ?? 680) + 'px';
    }

    /* ---------- GPS 處理：濾雜訊、延遲播放、平滑移動 ---------- */
    const DEADBAND_M = 3;          // 停車時忽略小於 3 公尺的飄移
    const MAX_SPEED_MS = 50;       // 超過 180 km/h 視為 GPS 跳點，需連續兩筆一致才採用
    const SNAP_M = 400;            // 距離過遠時直接跳過去，不橫跨地圖滑行
    const MAX_SEGMENT_MS = 2500;   // 停車很久後起步，不把移動攤平到整段等待時間

    const queue = [];
    let lastAccepted = null;
    let suspect = null;
    let shown = null;

    const metres = (a, b) => {
      const rad = Math.PI / 180;
      const x = (b.lng - a.lng) * rad * Math.cos(((a.lat + b.lat) / 2) * rad);
      const y = (b.lat - a.lat) * rad;
      return Math.hypot(x, y) * 6371000;
    };

    function onFix(lat, lng) {
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
      const p = { lat, lng, t: Date.now() };
      lastFixAt = p.t;
      status.gps = '連線中';

      if (lastAccepted) {
        const d = metres(lastAccepted, p);
        if (d < DEADBAND_M) { lastAccepted.t = p.t; return; }
        const dt = Math.max((p.t - lastAccepted.t) / 1000, 1);
        if (d / dt > MAX_SPEED_MS) {
          const confirmed = suspect && metres(suspect, p) < 60;
          if (!confirmed) { suspect = p; return; }
        }
      }
      suspect = null;
      lastAccepted = p;
      queue.push(p);
    }

    function goalAt(playAt) {
      while (queue.length >= 2 && queue[1].t <= playAt) queue.shift();
      const a = queue[0];
      if (!a || a.t > playAt) return null;
      const b = queue[1];
      if (!b) return a;
      const start = Math.max(a.t, b.t - MAX_SEGMENT_MS);
      const k = Math.min(Math.max((playAt - start) / (b.t - start), 0), 1);
      return { lat: a.lat + (b.lat - a.lat) * k, lng: a.lng + (b.lng - a.lng) * k };
    }

    /* ---------- Google 地圖 ---------- */
    let map = null;
    let mapFailed = false;
    let revealed = false;

    function reveal() {
      if (revealed || mapFailed || !shown) return;
      revealed = true;
      $('mapShell').classList.add('on');
    }

    async function startMap() {
      const avatar = $('avatar');
      avatar.onerror = () => { avatar.style.display = 'none'; $('avatarDot').style.display = 'block'; };
      avatar.src = C.avatar || './avatar.png';

      // 地圖出錯時直接隱藏，避免 Google 的錯誤視窗出現在直播畫面
      const failMap = (why) => {
        status.map = why;
        if (DEMO) return;
        mapFailed = true;
        $('mapShell').classList.remove('on');
      };
      window.gm_authFailure = () => failMap('金鑰錯誤或網址未授權');
      setInterval(() => {
        if (!mapFailed && $('map').querySelector('.dismissButton, .gm-err-container')) {
          failMap('Google 地圖回報錯誤，請檢查金鑰與帳單');
        }
      }, 500);

      const key = C.googleMapsApiKey || '';
      if (!key && !DEMO) { status.map = '尚未填 Google Maps Key'; return; }

      const params = new URLSearchParams({
        v: 'quarterly', language: 'zh-TW', region: 'TW', loading: 'async', callback: '__mapsReady',
      });
      if (key) params.set('key', key);
      status.map = '載入中';
      const mapsReady = new Promise((resolve) => { window.__mapsReady = resolve; });
      await loadWithRetry('https://maps.googleapis.com/maps/api/js?' + params, 'map');
      await mapsReady;
      const { Map } = await google.maps.importLibrary('maps');

      while (!shown) await wait(100);

      const hideNoise = (C.map?.hidePoi ?? true) ? [
        { featureType: 'poi', stylers: [{ visibility: 'off' }] },
        { featureType: 'transit', stylers: [{ visibility: 'off' }] },
      ] : [];

      map = new Map($('map'), {
        center: shown,
        zoom: C.map?.zoom ?? 17,
        disableDefaultUI: true,
        gestureHandling: 'none',
        keyboardShortcuts: false,
        clickableIcons: false,
        backgroundColor: '#e8eaed',
        styles: hideNoise,
      });
      status.map = '正常';
      google.maps.event.addListenerOnce(map, 'tilesloaded', reveal);
      setTimeout(reveal, 4000);
    }

    let prevFrame = 0;
    function frame(now) {
      requestAnimationFrame(frame);
      if (now - prevFrame < 33) return; // 約 30fps，降低 OBS 負擔
      const dt = Math.min(now - prevFrame, 250);
      prevFrame = now;

      const goal = goalAt(Date.now() - delayMs);
      if (!goal) return;
      if (!shown || metres(shown, goal) > SNAP_M) {
        shown = { lat: goal.lat, lng: goal.lng };
      } else {
        const tau = delayMs >= 1500 ? 200 : 700;
        const alpha = 1 - Math.exp(-dt / tau);
        shown = { lat: shown.lat + (goal.lat - shown.lat) * alpha, lng: shown.lng + (goal.lng - shown.lng) * alpha };
      }
      if (map) map.setCenter(shown);
    }

    /* ---------- GPS 來源 ---------- */
    async function startGps() {
      if (DEMO) return startDemoGps();
      if (!pullKey) { status.gps = '尚未設定 Pull Key'; return; }
      await loadWithRetry('https://cdn.jsdelivr.net/npm/@rtirl/api@1.2.5/lib/index.min.js', 'gps');
      window.RealtimeIRL.forPullKey(pullKey).addLocationListener((loc) => {
        if (loc) onFix(loc.latitude, loc.longitude);
      });
    }

    function startDemoGps() {
      const route = [
        [22.5032, 120.3925], [22.5046, 120.3929], [22.5060, 120.3934], [22.5073, 120.3938],
        [22.5078, 120.3952], [22.5083, 120.3968], [22.5096, 120.3972], [22.5110, 120.3976],
      ];
      let i = 0;
      let k = 0;
      setInterval(() => {
        const a = route[i];
        const b = route[(i + 1) % route.length];
        onFix(a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k);
        k += 0.14;
        if (k >= 1) { k = 0; i = (i + 1) % route.length; }
      }, 1000);
    }

    /* ---------- 字卡 ---------- */
    let currentNext = null;
    let swapTimer = null;

    function applyNextStop(text, visible) {
      const card = $('nextStop');
      const el = $('nextText');
      const hasText = !!text;
      if (!features.nextStop || !visible || !hasText) {
        card.classList.remove('on');
        if (hasText) { el.textContent = text; currentNext = text; }
        return;
      }
      const wasOn = card.classList.contains('on');
      if (wasOn && text !== currentNext) {
        clearTimeout(swapTimer);
        el.classList.add('swap');
        swapTimer = setTimeout(() => { el.textContent = text; el.classList.remove('swap'); }, 200);
      } else {
        el.textContent = text;
      }
      currentNext = text;
      card.classList.add('on');
    }

    let currentMarquee = null;
    function applyMarquee(text, visible) {
      const box = $('marquee');
      if (!features.marquee || !visible || !text) { box.classList.remove('on'); return; }
      box.classList.add('on');
      if (text === currentMarquee) return;
      currentMarquee = text;

      const track = $('mqTrack');
      track.classList.remove('scroll');
      $('mqA').textContent = text;
      $('mqB').textContent = text;
      requestAnimationFrame(() => {
        const view = track.parentElement;
        const w = $('mqA').getBoundingClientRect().width;
        if (w > view.clientWidth + 1) {
          const dist = w + 90;
          track.style.setProperty('--mq-dist', -dist + 'px');
          track.style.setProperty('--mq-time', Math.max(dist / 90, 6) + 's');
          track.classList.add('scroll');
        }
      });
    }

    function applyState(s) {
      s = s || {};
      applyNextStop(s.nextStop || '', s.nextStopVisible !== false);
      applyMarquee(s.marqueeText || '', s.marqueeVisible !== false);
    }

    async function startCards() {
      if (!features.nextStop && !features.marquee) return;

      if (DEMO) {
        status.firebase = '示範模式';
        const read = () => { try { return JSON.parse(localStorage.getItem('overlay-demo-state') || '{}'); } catch { return {}; } };
        applyState(read());
        new BroadcastChannel('overlay-demo').onmessage = (e) => applyState(e.data);
        return;
      }

      if (!C.firebase?.databaseURL) { status.firebase = '尚未填 Firebase 設定'; return; }
      if (!room) { status.firebase = 'OBS 網址缺少 room'; return; }

      const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
      await loadWithRetry(base + 'firebase-app-compat.js', 'firebase');
      await loadWithRetry(base + 'firebase-database-compat.js', 'firebase');
      const app = firebase.initializeApp(C.firebase, 'overlay');
      const db = app.database();
      db.ref('.info/connected').on('value', (snap) => { status.firebase = snap.val() ? '連線中' : '重新連線中'; });
      db.ref('rooms/' + room).on('value', (snap) => applyState(snap.val()),
        (err) => { status.firebase = '讀取失敗：' + err.code; });
    }

    /* ---------- 除錯資訊（只有 ?debug=1 會顯示） ---------- */
    function startDebug() {
      if (!query.has('debug')) return;
      const box = $('debug');
      box.style.display = 'block';
      setInterval(() => {
        const age = lastFixAt ? Math.round((Date.now() - lastFixAt) / 1000) + ' 秒前' : '尚無';
        box.textContent = `GPS：${status.gps}（最後更新 ${age}）\n地圖：${status.map}\nFirebase：${status.firebase}\n延遲：${delayMs} ms`;
      }, 500);
    }

    applyTheme();
    startDebug();
    requestAnimationFrame(frame);
    if (features.map) { startGps(); startMap(); }
    startCards();
  })();
  </script>
</body>
</html>
