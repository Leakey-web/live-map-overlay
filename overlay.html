<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>車掃小地圖</title>
<style>
  :root { --ring: #2453E6; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
  }

  #mapShell {
    position: absolute;
    width: 396px;
    height: 396px;
    border-radius: 50%;
    background: var(--ring);
    box-shadow: 0 8px 22px rgba(0, 0, 0, .42);
    opacity: 0;
    transition: opacity .6s ease;
  }
  #mapShell.on { opacity: 1; }
  .map-clip {
    position: absolute;
    left: 8px;
    top: 8px;
    width: 380px;
    height: 380px;
    border-radius: 50%;
    overflow: hidden;
    background: #f3f1ec;
    isolation: isolate;
  }
  #tiles { position: absolute; left: 0; top: 0; will-change: transform; }
  .tile { position: absolute; display: block; width: 256px; height: 256px; user-select: none; }
  #avatar, #avatarDot {
    position: absolute;
    left: 166px;
    top: 166px;
    width: 64px;
    height: 64px;
    pointer-events: none;
  }
  #avatar { object-fit: contain; filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .45)); }
  #avatarDot {
    display: none;
    left: 182px;
    top: 182px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--ring);
    border: 5px solid #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .5);
  }

  /* 只在 ?debug=1 時顯示，正式直播不會出現 */
  #debug {
    display: none;
    position: absolute;
    left: 20px;
    top: 20px;
    padding: 10px 14px;
    border-radius: 8px;
    background: rgba(0, 0, 0, .78);
    color: #7dffa8;
    font: 18px/1.5 ui-monospace, Menlo, Consolas, "PingFang TC", "Microsoft JhengHei", monospace;
    white-space: pre;
  }
</style>
</head>
<body>
  <div id="mapShell">
    <div class="map-clip"><div id="tiles"></div></div>
    <img id="avatar" alt="">
    <div id="avatarDot"></div>
  </div>

  <div id="debug"></div>

  <script src="./config.js"></script>
  <script>
  (() => {
    'use strict';

    const C = window.OVERLAY_CONFIG || {};
    const hash = new URLSearchParams(location.hash.slice(1));
    const query = new URLSearchParams(location.search);
    const DEMO = query.has('demo');

    const pullKey = hash.get('pull') || C.rtirlPullKey || '';
    const delayRaw = Number(hash.get('delay') ?? C.gpsDelayMs ?? 0);
    const delayMs = Number.isFinite(delayRaw) ? Math.min(Math.max(delayRaw, 0), 30000) : 0;

    const $ = (id) => document.getElementById(id);
    const status = { gps: '等待中', map: '等待 GPS' };
    let lastFixAt = 0;

    const loadScript = (src) => new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = resolve;
      s.onerror = () => { s.remove(); reject(new Error('載入失敗：' + src.split('?')[0])); };
      document.head.appendChild(s);
    });
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    async function loadWithRetry(src, label) {
      for (;;) {
        try { return await loadScript(src); }
        catch (e) { status[label] = '載入失敗，5 秒後重試'; await wait(5000); }
      }
    }

    function applyLayout() {
      if (C.theme?.ring) document.documentElement.style.setProperty('--ring', C.theme.ring);
      $('mapShell').style.right = (C.map?.right ?? 50) + 'px';
      $('mapShell').style.bottom = (C.map?.bottom ?? 270) + 'px';
      const avatar = $('avatar');
      avatar.onerror = () => { avatar.style.display = 'none'; $('avatarDot').style.display = 'block'; };
      avatar.src = C.avatar || './avatar.png';
    }

    /* ---------- GPS 處理：濾雜訊、延遲播放、平滑移動 ---------- */
    const DEADBAND_M = 3;          // 停車時忽略小於 3 公尺的飄移
    const MAX_SPEED_MS = 50;       // 超過 180 km/h 視為 GPS 跳點，需連續兩筆一致才採用
    const SNAP_M = 400;            // 距離過遠時直接跳過去，不橫跨地圖滑行
    const MAX_SEGMENT_MS = 2500;   // 停車很久後起步，不把移動攤平到整段等待時間

    const queue = [];
    let lastAccepted = null;
    let suspect = null;
    let shown = null;

    const metres = (a, b) => {
      const rad = Math.PI / 180;
      const x = (b.lng - a.lng) * rad * Math.cos(((a.lat + b.lat) / 2) * rad);
      const y = (b.lat - a.lat) * rad;
      return Math.hypot(x, y) * 6371000;
    };

    function onFix(lat, lng) {
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
      const p = { lat, lng, t: Date.now() };
      lastFixAt = p.t;
      status.gps = '連線中';

      if (lastAccepted) {
        const d = metres(lastAccepted, p);
        if (d < DEADBAND_M) { lastAccepted.t = p.t; return; }
        const dt = Math.max((p.t - lastAccepted.t) / 1000, 1);
        if (d / dt > MAX_SPEED_MS) {
          const confirmed = suspect && metres(suspect, p) < 60;
          if (!confirmed) { suspect = p; return; }
        }
      }
      suspect = null;
      lastAccepted = p;
      queue.push(p);
    }

    function goalAt(playAt) {
      while (queue.length >= 2 && queue[1].t <= playAt) queue.shift();
      const a = queue[0];
      if (!a || a.t > playAt) return null;
      const b = queue[1];
      if (!b) return a;
      const start = Math.max(a.t, b.t - MAX_SEGMENT_MS);
      const k = Math.min(Math.max((playAt - start) / (b.t - start), 0), 1);
      return { lat: a.lat + (b.lat - a.lat) * k, lng: a.lng + (b.lng - a.lng) * k };
    }

    /* ---------- 地圖圖磚：不需金鑰，也不依賴 WebGL ---------- */
    const TILE_SIZE = 256;
    const VIEW_SIZE = 380;
    const MAX_ZOOM = 15; // 開放圖資的最大層級，超過只會得到空白圖磚
    const REVEAL_WAIT_MS = 2500;

    const zoom = Math.min(Math.round(C.map?.zoom ?? MAX_ZOOM), MAX_ZOOM);
    const worldSize = TILE_SIZE * 2 ** zoom;
    const tileTemplate = C.map?.tileUrl
      || 'https://wmts.nlsc.gov.tw/wmts/EMAP6_OPENDATA/default/GoogleMapsCompatible/{z}/{y}/{x}';
    const tiles = new Map();
    const layer = $('tiles');
    let origin = null;
    let rangeKey = '';
    let viewKeys = [];
    let revealTimer = null;
    let revealed = false;

    const tileSrc = (x, y, attempt) => {
      const url = tileTemplate.replace('{z}', zoom).replace('{y}', y).replace('{x}', x);
      return attempt ? `${url}?retry=${attempt}` : url;
    };

    function project({ lat, lng }) {
      const sin = Math.sin((lat * Math.PI) / 180);
      return {
        x: ((lng + 180) / 360) * worldSize,
        y: (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * worldSize,
      };
    }

    function reveal() {
      if (revealed) return;
      revealed = true;
      clearTimeout(revealTimer);
      $('mapShell').classList.add('on');
    }

    function onTileReady() {
      status.map = '正常';
      if (revealed) return;
      if (!revealTimer) revealTimer = setTimeout(reveal, REVEAL_WAIT_MS);
      if (viewKeys.every((k) => tiles.get(k)?.ready)) reveal();
    }

    function addTile(x, y) {
      const key = `${x}/${y}`;
      if (tiles.has(key)) return;
      const img = new Image();
      const rec = { img, ready: false, attempts: 0, retry: null };
      img.className = 'tile';
      img.alt = '';
      img.draggable = false;
      img.style.left = x * TILE_SIZE - origin.x + 'px';
      img.style.top = y * TILE_SIZE - origin.y + 'px';
      img.onload = () => { rec.ready = true; onTileReady(); };
      img.onerror = () => {
        rec.attempts += 1;
        status.map = '圖資載入失敗，重試中';
        rec.retry = setTimeout(() => {
          if (tiles.get(key) === rec) img.src = tileSrc(x, y, rec.attempts);
        }, Math.min(1000 * 2 ** rec.attempts, 15000));
      };
      img.src = tileSrc(x, y, 0);
      layer.appendChild(img);
      tiles.set(key, rec);
    }

    function syncTiles(p) {
      const cell = (v) => Math.floor(v / TILE_SIZE);
      const half = VIEW_SIZE / 2;
      const view = { x0: cell(p.x - half), x1: cell(p.x + half), y0: cell(p.y - half), y1: cell(p.y + half) };
      const key = `${view.x0},${view.x1},${view.y0},${view.y1}`;
      if (key === rangeKey) return;
      rangeKey = key;

      // 多載入一圈，車子移動時不會看到空白
      viewKeys = [];
      for (let y = view.y0 - 1; y <= view.y1 + 1; y++) {
        for (let x = view.x0 - 1; x <= view.x1 + 1; x++) {
          addTile(x, y);
          if (x >= view.x0 && x <= view.x1 && y >= view.y0 && y <= view.y1) viewKeys.push(`${x}/${y}`);
        }
      }
      for (const [k, rec] of tiles) {
        const [x, y] = k.split('/').map(Number);
        if (x < view.x0 - 2 || x > view.x1 + 2 || y < view.y0 - 2 || y > view.y1 + 2) {
          clearTimeout(rec.retry);
          rec.img.onload = rec.img.onerror = null;
          rec.img.remove();
          tiles.delete(k);
        }
      }
    }

    function renderMap() {
      const p = project(shown);
      if (!origin) {
        origin = { x: Math.floor(p.x / TILE_SIZE) * TILE_SIZE, y: Math.floor(p.y / TILE_SIZE) * TILE_SIZE };
        status.map = '載入中';
      }
      syncTiles(p);
      const tx = VIEW_SIZE / 2 - (p.x - origin.x);
      const ty = VIEW_SIZE / 2 - (p.y - origin.y);
      layer.style.transform = `translate3d(${tx.toFixed(2)}px, ${ty.toFixed(2)}px, 0)`;
    }

    let prevFrame = 0;
    function frame(now) {
      requestAnimationFrame(frame);
      tick(now);
    }
    // 來源被隱藏時瀏覽器可能暫停動畫，用計時器確保定位與地圖不中斷
    setInterval(() => {
      const now = performance.now();
      if (now - prevFrame >= 500) tick(now);
    }, 500);

    function tick(now) {
      if (now - prevFrame < 33) return; // 約 30fps，降低 OBS 負擔
      const dt = Math.min(now - prevFrame, 250);
      prevFrame = now;

      const goal = goalAt(Date.now() - delayMs);
      if (!goal) return;
      if (!shown || metres(shown, goal) > SNAP_M) {
        shown = { lat: goal.lat, lng: goal.lng };
      } else {
        const tau = delayMs >= 1500 ? 200 : 700;
        const alpha = 1 - Math.exp(-dt / tau);
        shown = { lat: shown.lat + (goal.lat - shown.lat) * alpha, lng: shown.lng + (goal.lng - shown.lng) * alpha };
      }
      renderMap();
    }

    /* ---------- GPS 來源 ---------- */
    async function startGps() {
      if (DEMO) return startDemoGps();
      if (!pullKey) { status.gps = '尚未設定 Pull Key'; return; }
      await loadWithRetry('https://cdn.jsdelivr.net/npm/@rtirl/api@1.2.5/lib/index.min.js', 'gps');
      window.RealtimeIRL.forPullKey(pullKey).addLocationListener((loc) => {
        if (loc) onFix(loc.latitude, loc.longitude);
      });
    }

    function startDemoGps() {
      const route = [
        [22.6265, 120.2960], [22.6280, 120.2975], [22.6295, 120.2990], [22.6315, 120.3020],
        [22.6330, 120.3035], [22.6345, 120.3020], [22.6330, 120.2990], [22.6300, 120.2965],
      ];
      let i = 0;
      let k = 0;
      setInterval(() => {
        const a = route[i];
        const b = route[(i + 1) % route.length];
        onFix(a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k);
        k += 0.08;
        if (k >= 1) { k = 0; i = (i + 1) % route.length; }
      }, 1000);
    }

    /* ---------- 除錯資訊（只有 ?debug=1 會顯示） ---------- */
    function startDebug() {
      if (!query.has('debug')) return;
      const box = $('debug');
      box.style.display = 'block';
      setInterval(() => {
        const age = lastFixAt ? Math.round((Date.now() - lastFixAt) / 1000) + ' 秒前' : '尚無';
        box.textContent = `GPS：${status.gps}（最後更新 ${age}）\n地圖：${status.map}\n延遲：${delayMs} ms`;
      }, 500);
    }

    applyLayout();
    startDebug();
    requestAnimationFrame(frame);
    startGps();
  })();
  </script>
</body>
</html>
