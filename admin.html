<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<meta name="robots" content="noindex">
<title>小地圖設定</title>
<style>
  :root {
    --bg: #10131c;
    --panel: #1b2030;
    --line: #30384e;
    --text: #f3f5fa;
    --muted: #a3adc4;
    --accent: #2f60f2;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.5 "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  main { max-width: 620px; margin: 0 auto; padding: 22px 16px calc(36px + env(safe-area-inset-bottom)); }
  h1 { margin: 0; font-size: 25px; }
  h2 { margin: 0 0 10px; font-size: 19px; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 15px; }
  .panel { margin-top: 14px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .stack { display: grid; gap: 12px; }
  label { display: grid; gap: 6px; font-size: 15px; color: var(--muted); }
  input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #0d1018;
    color: var(--text);
    font: inherit;
    font-size: 18px;
  }
  button, .button {
    display: block;
    width: 100%;
    min-height: 52px;
    padding: 13px 14px;
    border: 0;
    border-radius: 11px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }
  .secondary { background: #2a3144; }
  button:active, .button:active { filter: brightness(.85); }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #8fb0ff; outline-offset: 1px; }
  .code { display: block; max-height: 110px; overflow: auto; padding: 11px; border-radius: 8px; background: #0d1018; color: #b9c8ff; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
  .alert { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: #3a2f12; color: #ffe2a0; font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td { padding: 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
  tr:first-child td { border-top: 0; }
  td:first-child { width: 58%; padding-right: 10px; color: var(--muted); }
  td:last-child { font-weight: 700; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    max-width: calc(100vw - 32px);
    padding: 11px 18px;
    border-radius: 24px;
    background: #fff;
    color: #111;
    font-weight: 700;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .45);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 10px);
    transition: opacity .18s, transform .18s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { background: #ff5c5c; color: #fff; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>小地圖設定</h1>
  <p class="muted" style="margin-top:6px">任何電腦都能開這頁產生 OBS 網址。Pull Key 只在這個瀏覽器內處理，不會上傳或儲存。</p>

  <form id="setupForm" class="panel stack">
    <label>RealtimeIRL Pull Key
      <input id="pull" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    </label>
    <label>GPS 延遲（秒），用來對齊 4G 背包畫面
      <input id="delay" type="number" inputmode="decimal" min="0" max="30" step="0.1" required>
    </label>
    <button type="submit">產生 OBS 網址</button>
  </form>

  <section id="result" hidden>
    <div class="panel stack">
      <h2 style="margin:0">OBS 瀏覽器來源網址</h2>
      <code class="code" id="obsUrl"></code>
      <button id="copy" type="button">複製網址</button>
      <a id="test" class="button secondary" target="_blank" rel="noopener">開啟測試畫面</a>
    </div>
    <div class="alert">這個網址含有即時定位權限，請勿貼到公開群組、直播留言或截圖外傳。</div>
  </section>

  <section class="panel stack">
    <h2 style="margin:0">直播說明欄必貼文字</h2>
    <p class="muted">地圖使用政府開放資料，每場直播都要把這段貼到說明欄，否則授權會失效。</p>
    <code class="code" id="credit" style="white-space:pre-wrap"></code>
    <button id="copyCredit" class="secondary" type="button">複製標示文字</button>
  </section>

  <section class="panel">
    <h2>OBS 瀏覽器來源設定</h2>
    <table>
      <tr><td>寬度 / 高度</td><td>1920 / 1080</td></tr>
      <tr><td>自訂影格率</td><td>開啟，30</td></tr>
      <tr><td>來源不顯示時關閉</td><td>不要勾</td></tr>
      <tr><td>場景啟用時重新整理</td><td>不要勾</td></tr>
      <tr><td>圖層順序與位置</td><td>最上層，0,0，不縮放</td></tr>
    </table>
  </section>
</main>
<div id="toast" role="status"></div>

<script src="./config.js"></script>
<script>
(() => {
  'use strict';

  const C = window.OVERLAY_CONFIG || {};
  const $ = (id) => document.getElementById(id);

  let toastTimer;
  function toast(msg, isError) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('err', !!isError);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), isError ? 3600 : 1500);
  }

  $('credit').textContent = C.mapCredit || '';
  $('delay').value = String((C.gpsDelayMs ?? 3000) / 1000);

  $('setupForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const pull = $('pull').value.trim();
    const seconds = Number($('delay').value);
    if (!pull) { toast('請先貼上 Pull Key', true); $('pull').focus(); return; }
    if (!Number.isFinite(seconds) || seconds < 0 || seconds > 30) { toast('延遲請填 0 到 30 秒', true); return; }

    const base = new URL('./', location.href.split('#')[0].split('?')[0]).href;
    const params = new URLSearchParams({ pull, delay: String(Math.round(seconds * 1000)) });
    $('obsUrl').textContent = `${base}overlay.html#${params}`;
    $('test').href = `${base}overlay.html?debug=1#${params}`;
    $('result').hidden = false;
    $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  async function copyFrom(id) {
    try {
      await navigator.clipboard.writeText($(id).textContent);
      toast('已複製');
    } catch {
      const range = document.createRange();
      range.selectNodeContents($(id));
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      toast('請手動複製已選取的文字', true);
    }
  }
  $('copy').addEventListener('click', () => copyFrom('obsUrl'));
  $('copyCredit').addEventListener('click', () => copyFrom('credit'));
})();
</script>
</body>
</html>
